<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <title>Relax to Order Shops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
    .header {
      background: linear-gradient(90deg, #004d99, #007bff);
      color: white;
      padding: 25px 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      margin-bottom: 20px;
    }
    .container h4 { color: #004d99; margin-bottom: 20px; font-weight: 600; }
    .product-card {
      border-radius: 20px;
      background:white;
      padding:25px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 30px;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .product-card h5 { font-weight:bold; color:#004d99; margin-bottom:10px; }
    .product-card p { margin-bottom:15px; color:#555; }
    .btn-contact {
      background-color: #007bff;
      color:white;
      border:none;
      border-radius:10px;
      padding:8px 15px;
      transition: background 0.3s;
      text-decoration: none;
    }
    .btn-contact:hover { background-color:#0056b3; color:white; }
    #searchWrapper {
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #searchInput {
      padding: 12px 18px;
      font-size: 1em;
      width: 70%;
      max-width: 400px;
      border: 2px solid #0077b6;
      border-right: none;
      border-radius: 8px 0 0 8px;
      outline: none;
    }
    #searchBtn {
      padding: 12px 22px;
      font-size: 1em;
      background-color: #0077b6;
      color: white;
      border: 2px solid #0077b6;
      border-left: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      font-weight: bold;
    }
    #searchBtn:hover { background-color: #0056b3; }
  </style>
</head>
<body>

<div class="header">Cuddalore</div>

<div class="container text-center">
  <h4>Shops Name</h4>

  <!-- Search Box + Button -->
  <div id="searchWrapper">
    <input type="text" id="searchInput" placeholder="Search Shop Name or Code">
    <button id="searchBtn">🔍</button>
  </div>

  <div class="row justify-content-center" id="shopList">
    <!-- HTML Shop Cards -->
    
    <div class="col-md-4">
      <div class="product-card" data-name="Ramesh Store" data-code="A001" data-address="Cuddalore Puthuppalayam West Street" data-map="https://maps.google.com/?q=Cuddalore+Puthuppalayam+West+Street">
        <h5>Ramesh மல்லிகை கடை</h5>
        <p>📍 Cuddalore Puthuppalayam West Street</p>
        <a href="ramesh store.html" class="btn-contact">Open Store</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="product-card" data-name="Apple Super Market" data-code="A002" data-address="Thipapuliyur Main Road" data-map="https://maps.google.com/?q=Thipapuliyur+Main+Road">
        <h5>Apple Super Market</h5>
        <p>📍 Thipapuliyur Main Road</p>
        <a href="#" class="btn-contact">Open Store</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="product-card" data-name="Saravanan Store" data-code="A003" data-address="Cuddalore Chavadi" data-map="https://maps.google.com/?q=Cuddalore+Chavadi">
        <h5>Saravanan Store</h5>
        <p>📍 Cuddalore Chavadi</p>
        <a href="#" class="btn-contact">Open Store</a>
      </div>
    </div>

    <!-- EXTRA Shop Example -->
    <div class="col-md-4">
      <div class="product-card" data-name="New Shop Name" data-code="A004" data-address="New Address Street" data-map="https://maps.google.com/?q=New+Address+Street">
        <h5>New Shop Name</h5>
        <p>📍 New Address Street</p>
        <a href="#" class="btn-contact">Open Store</a>
      </div>
    </div>









  </div>
</div>

<script>
  const shopList = document.getElementById('shopList');
  const searchInput = document.getElementById('searchInput');


  // Typing filter
  searchInput.addEventListener('input', function(){
    const filter = this.value.toLowerCase();
    document.querySelectorAll('.product-card').forEach(card => {
      const name = card.getAttribute('data-name').toLowerCase();
      const code = card.getAttribute('data-code').toLowerCase();
      if(name.includes(filter) || code.includes(filter)){
        card.parentElement.style.display = "block";
      } else {
        card.parentElement.style.display = "none";
      }
    });
  });

  // Search button just focuses input
  document.getElementById('searchBtn').addEventListener('click', () => {
    searchInput.focus();
  });
</script>

</body>
</html>
